<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#0d1b2a"/>
  
  <!-- Brand name -->
  <text x="400" y="150" font-family="Arial, sans-serif" font-size="120" font-weight="bold" 
        fill="#00c6ff" text-anchor="middle">IONITY</text>
  
  <!-- Subtitle -->
  <text x="400" y="220" font-family="Arial, sans-serif" font-size="36" 
        fill="#00c6ff" text-anchor="middle" opacity="0.8">Antwerp Designs</text>
  
  <!-- Tech stack -->
  <text x="400" y="280" font-family="Arial, sans-serif" font-size="24" 
        fill="#8899aa" text-anchor="middle">IoT | AI | Hardware | Cloud</text>
  
  <!-- Border -->
  <rect x="20" y="20" width="760" height="360" rx="10" fill="none" stroke="#00c6ff" stroke-width="2" opacity="0.3"/>
</svg>
