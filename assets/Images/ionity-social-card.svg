<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1b2838;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Grid pattern -->
  <g stroke="#00c6ff" stroke-width="1" opacity="0.1">
    <line x1="0" y1="157.5" x2="1200" y2="157.5"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472.5" x2="1200" y2="472.5"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>
  
  <!-- Main title -->
  <text x="600" y="220" font-family="Arial, sans-serif" font-size="96" font-weight="bold" 
        fill="#00c6ff" text-anchor="middle">IONITY</text>
  
  <!-- Subtitle -->
  <text x="600" y="290" font-family="Arial, sans-serif" font-size="42" 
        fill="#00c6ff" text-anchor="middle" opacity="0.9">Metadata &amp; Asset Library</text>
  
  <!-- Description -->
  <text x="600" y="360" font-family="Arial, sans-serif" font-size="28" 
        fill="#8899aa" text-anchor="middle">IoT · AI · Hardware · Cloud · Edge Computing</text>
  
  <!-- Tagline -->
  <text x="600" y="480" font-family="Arial, sans-serif" font-size="24" font-style="italic"
        fill="#00c6ff" text-anchor="middle" opacity="0.7">Building Tomorrow, Today</text>
  
  <!-- Logo decoration -->
  <g stroke="#00c6ff" stroke-width="3" fill="none" opacity="0.3">
    <circle cx="200" cy="315" r="50"/>
    <circle cx="1000" cy="315" r="50"/>
    <path d="M 250 315 L 950 315"/>
  </g>
</svg>
